name: Release

# Push a tag like v0.2.0 to build every platform and attach the packages to a
# draft GitHub release. Review the draft, then publish it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The injector and agent are Windows programs on every platform (Linux runs
  # them inside Proton), so they are built once here and shared.
  tools:
    name: Windows tools
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build sc-inject, sc-agent and sc-launch
        run: cargo build --release --locked -p sc-inject -p sc-agent -p sc-launch
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tools
          path: |
            target/release/sc-inject.exe
            target/release/sc_agent.dll
            target/release/sc-launch.exe
          if-no-files-found: error

  bundle:
    name: Package (${{ matrix.name }})
    needs: tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf rpm
      - uses: actions/download-artifact@v4
        with:
          name: windows-tools
          path: dist/tools
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./gui/src-tauri/tauri.conf.json').version")
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but tauri.conf.json says $have"; exit 1; }
      - name: Build launcher packages
        working-directory: gui/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --ci --config tauri.release.conf.json
      - name: Build sc-launch (Linux CLI)
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p sc-launch
      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./gui/src-tauri/tauri.conf.json').version")
          mkdir -p out cli
          cp dist/tools/sc-inject.exe dist/tools/sc_agent.dll cli/
          if [ "$RUNNER_OS" = Linux ]; then
            cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage out/
            cp target/release/sc-launch cli/
            tar -czf "out/sc-launch_${version}_linux_x64.tar.gz" -C cli .
          else
            cp target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe out/
            cp dist/tools/sc-launch.exe cli/
            (cd cli && 7z a "../out/sc-launch_${version}_windows_x64.zip" . >/dev/null)
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: out/*
